name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # manual run: gh workflow run CI -R mcthulhu1/skills

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Plugin file types, manifests, skill front matter, icons and changelog entries
        shell: bash
        # Plugins for the Claude plugin directory hold no scripts: the directory accepts from unverified authors only
        # Markdown, text, JSON, YAML and images. The owner keeps the same checks as a local script; keep both in sync.
        run: |
          set -euo pipefail
          cd "${1:-.}"
          # Plugins that are not submitted to the plugin directory (they may hold scripts).
          GITHUB_ONLY="appsec-scan"
          fail=0
          err() { echo "ERROR $*"; fail=1; }

          # 1. Directory policy for one plugin folder: allowed types, no #!, no package manager configs, UTF-8 text without NUL.
          policy() {
            while IFS= read -r -d '' f; do
              case "${f##*/}" in
                .DS_Store|Thumbs.db|desktop.ini) err "$f: system file" ;;
                package.json|package-lock.json|pnpm-*.yaml|yarn.lock|bun.lock*|requirements*.txt|Pipfile*|pyproject.toml|Gemfile*|go.mod|Cargo.toml|.npmrc|uv.toml|bunfig.toml)
                  err "$f: package manager configuration" ;;
              esac
              case "${f##*/}" in
                LICENSE|.gitignore|*.md|*.txt|*.json|*.yaml|*.yml|*.png|*.jpg|*.jpeg|*.gif|*.webp) ;;
                *) err "$f: type not accepted by the plugin directory" ;;
              esac
              [ "$(head -c2 "$f")" != '#!' ] || err "$f: starts with #!"
              case "$f" in *.png|*.jpg|*.jpeg|*.gif|*.webp) continue ;; esac
              tr -d '\000' < "$f" | cmp -s - "$f" || err "$f: contains NUL bytes"
              iconv -f UTF-8 -t UTF-8 "$f" >/dev/null 2>&1 || err "$f: not UTF-8"
              [ "$(wc -c < "$f")" -le 262144 ] || err "$f: larger than 256 KiB"
            done < <(find "$1" -type f -print0)
          }

          # 2. One plugin: manifest, README, LICENSE, skills, icon, changelog entry.
          plugin() {
            local dir=$1 P="$1/.claude-plugin/plugin.json" name version listed md fm desc
            jq -e . "$P" >/dev/null 2>&1 || { err "$P: missing or not JSON"; return; }
            name=$(jq -r '.name // ""' "$P")
            version=$(jq -r '.version // ""' "$P")
            [[ "$name" =~ ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$ ]] || err "$P: name must be lowercase letters, digits and hyphens"
            [ "$name" = "${dir##*/}" ] || err "$P: name $name must match the folder name"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || err "$P: version must be MAJOR.MINOR.PATCH"
            [ -f "$dir/LICENSE" ] || [ -n "$(jq -r '.license // ""' "$P")" ] || err "$dir: no LICENSE"
            if [ -f "$dir/README.md" ]; then
              [ "$(awk '/^```/ {c = !c; next} !c' "$dir/README.md" | wc -w)" -ge 40 ] || err "$dir/README.md: fewer than 40 words"
            else
              err "$dir: no README.md"
            fi
            listed=$(jq -r '.skills[]?' "$P" | sed 's|^\./||; s|/$||')
            for s in $listed; do
              md="$dir/$s/SKILL.md"
              [ -f "$md" ] || { err "$dir/$s: no SKILL.md"; continue; }
              fm=$(awk 'NR==1 && $0!="---" {exit} NR>1 && $0=="---" {exit} NR>1' "$md")
              [ "$(printf '%s\n' "$fm" | sed -n 's/^name:[[:space:]]*//p')" = "${s##*/}" ] \
                || err "$md: front matter name must match the directory name"
              desc=$(printf '%s\n' "$fm" | awk '/^description:/ {on=1; next} on && /^  / {print; next} {on=0}' | tr -s ' \n' ' ' | sed 's/^ //; s/ $//')
              [ -n "$desc" ] && [ "$(printf '%s' "$desc" | wc -m)" -le 1024 ] || err "$md: description must be 1..1024 characters"
              [ "$(printf '%s\n' "$fm" | sed -n 's/^  version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')" = "$version" ] \
                || err "$md: metadata.version must equal the plugin version $version"
            done
            for md in "$dir"/skills/*/SKILL.md; do
              [ -f "$md" ] || continue
              s=${md#"$dir/"}; s=${s%/SKILL.md}
              printf '%s\n' "$listed" | grep -qxF "$s" || err "$dir/$s: skill is not listed in plugin.json"
            done
            local icon w0 w1 w2 w3 h0 h1 h2 h3 w h
            icon=$(jq -r '.icon // ""' "$P")
            if [ -n "$icon" ]; then
              icon="$dir/${icon#./}"
              if [ -f "$icon" ] && [ "$(od -An -tx1 -N8 "$icon" | tr -d ' \n')" = 89504e470d0a1a0a ]; then
                read -r w0 w1 w2 w3 h0 h1 h2 h3 < <(od -An -tu1 -j16 -N8 "$icon")
                w=$(( (w0 << 24) + (w1 << 16) + (w2 << 8) + w3 )); h=$(( (h0 << 24) + (h1 << 16) + (h2 << 8) + h3 ))
                [ "$w" = "$h" ] && [ "$w" -ge 512 ] && [ "$w" -le 2048 ] && [ "$(wc -c < "$icon")" -le 2097152 ] \
                  || err "$icon: must be a square PNG of 512-2048 px under 2 MB"
              else
                err "$icon: not a PNG"
              fi
            fi
            grep -qE "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" "$dir/CHANGELOG.md" 2>/dev/null \
              || err "$dir/CHANGELOG.md: no \"## [$version] - YYYY-MM-DD\" section for the plugin version"
          }

          # 3. Marketplace: lists exactly the plugins under plugins/, by their manifest names.
          M=.claude-plugin/marketplace.json
          jq -e . "$M" >/dev/null || { echo FAIL; exit 1; }
          [ ! -e .claude-plugin/plugin.json ] || err ".claude-plugin/plugin.json: the root is a marketplace, not a plugin"
          while IFS=$'\t' read -r name src; do
            src=${src#./}
            [ -d "$src" ] || { err "$M: source $src of $name does not exist"; continue; }
            [ "$(jq -r '.name // ""' "$src/.claude-plugin/plugin.json" 2>/dev/null)" = "$name" ] \
              || err "$M: $name does not match the name in $src/.claude-plugin/plugin.json"
          done < <(jq -r '.plugins[] | [.name, .source] | @tsv' "$M")
          for dir in plugins/*/; do
            dir=${dir%/}
            jq -e --arg s "./$dir" '[.plugins[].source] | index($s)' "$M" >/dev/null || err "$dir: not listed in $M"
            plugin "$dir"
            case " $GITHUB_ONLY " in *" ${dir##*/} "*) ;; *) policy "$dir" ;; esac
          done

          [ "$fail" = 0 ] && echo OK || echo FAIL
          exit "$fail"

  appsec-unit:
    # report.py unit tests on saved scanner JSON: no network, standard library only
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04: actions/setup-python has no Python 3.9 for ubuntu-latest (26.04)
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: appsec-scan report tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests/appsec-scan -p 'test_*.py' -v 2>&1 | tee unit.log
          grep -Eq '^Ran [1-9][0-9]* tests?' unit.log || { echo "no tests ran"; exit 1; }

  appsec-integration:
    # scan.sh on fixture repositories, only with the test rules in tests/appsec-scan/rules (never the Semgrep registry)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            trivy: trivy_0.76.2_Linux-64bit.tar.gz
            trivy_sha256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
          - os: macos-latest
            trivy: trivy_0.76.2_macOS-ARM64.tar.gz
            trivy_sha256: ae7ea358326960406b703c77b2ac490190797d80b306b5b50c2a27221da0a5b8
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
        with:
          gradle-version: "9.9.0"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
      - name: Install trivy (pinned release, sha256 checked)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/trivy.tgz" "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/${{ matrix.trivy }}"
          echo "${{ matrix.trivy_sha256 }}  $RUNNER_TEMP/trivy.tgz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Fixtures
        shell: bash
        env:
          APPSEC_REQUIRE_JVM: "1"
          APPSEC_REQUIRE_DOCKER: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: |
          command -v mvn >/dev/null || { if [ "$RUNNER_OS" = macOS ]; then brew install maven; else sudo apt-get install -y maven; fi; }
          trivy --version
          mvn -v
          gradle --version
          bash tests/appsec-scan/run_integration.sh
      - name: Verified opengrep install (identity, signature, corrupted cache, interrupted and parallel updates)
        shell: bash
        run: bash tests/appsec-scan/run_opengrep_install.sh
      - name: No network with --no-update, files only in the cache (Linux, unshare + strace)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y strace
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # the runner itself lives in $HOME and keeps writing its logs there during the scan
          APPSEC_ISOLATION_IGNORE="^$HOME/actions-runner/" bash tests/appsec-scan/run_isolation.sh
      - name: Shell scripts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n plugins/appsec-scan/skills/appsec-scan/scan.sh
          shellcheck -S warning plugins/appsec-scan/skills/appsec-scan/scan.sh tests/appsec-scan/*.sh
